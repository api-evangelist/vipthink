name: VIPThink
description: 'VIPThink (豌豆思维) is a Chinese online education company operated by Guangdong
  Happy Seeds Technology Co., Ltd. (广东快乐种子科技有限公司), delivering small-class live-streaming
  courses in mathematical thinking and logic for young children (roughly ages 3-8). It
  is part of a family of consumer education brands that also includes Hualala drawing
  classes (画啦啦), Wandou speech training (豌豆口才), Gubi early-learning (咕比启蒙), and Little
  Lighthouse (小灯塔). The company was surfaced as a portfolio company of SoftBank Vision
  Fund and added to the API Evangelist network. As of this enrichment pass, VIPThink
  operates only consumer-facing web and mobile learning products and publishes no public
  developer portal, API documentation, SDKs, or machine-readable API surface.'
